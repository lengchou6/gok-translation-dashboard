    :root{--bg:#1d2925;--panel:#293732;--panel2:#33433b;--line:#45564b;--text:#f0f2ed;--muted:#b0bbb3;--cyan:#c6d7c9;--amber:#ddc58f;--ruby:#ecae99}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
    .wrap{width:min(1400px,calc(100% - 80px));margin:auto;padding:52px 0 32px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:32px;padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--line)}
    .title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:clamp(27px,2.6vw,35px);font-weight:600;line-height:1.3;letter-spacing:-.035em}
    .title-month-select{appearance:none;cursor:pointer;color:var(--text);font:inherit;letter-spacing:inherit;padding:4px 32px 4px 10px;border:1px solid #526359;border-radius:8px;background-color:#2a3a31;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--amber) 50%,transparent 50%);background-position:calc(100% - 19px) 52%,calc(100% - 13px) 52%;background-size:6px 6px;background-repeat:no-repeat}
    .title-month-select:hover{border-color:#809687;background-color:#34473b}
    .title-month-select option{font-family:"Microsoft YaHei",sans-serif;font-size:16px;background:var(--panel);color:var(--text)}
    :focus-visible{outline:2px solid var(--amber);outline-offset:4px}
    .source{flex-shrink:0;font-size:12px;line-height:1.8;text-align:right;color:var(--muted)}
    .source strong{display:block;font-weight:500;font-size:12px;letter-spacing:.04em;margin-bottom:6px;color:var(--muted)}
    .source-link{position:relative;display:inline-block;color:var(--cyan);text-decoration:underline;text-decoration-color:#6d8b78;text-underline-offset:5px;cursor:pointer}
    .source-link:hover{color:var(--amber)}
    .source-tooltip{position:absolute;right:0;bottom:calc(100% + 9px);z-index:20;width:max-content;max-width:min(340px,calc(100vw - 40px));padding:10px 14px;border:1px solid #789383;border-radius:8px;background:#3a5042;color:var(--text);box-shadow:0 6px 24px #061b2255;font:600 12px/1.5 "Microsoft YaHei",sans-serif;text-align:center;overflow-wrap:anywhere;opacity:0;visibility:hidden;pointer-events:none}
    .source-link:hover .source-tooltip,.source-link:focus .source-tooltip{opacity:1;visibility:visible}
    .metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:0 0 32px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
    .metric{min-width:0;padding:25px 24px 24px;border-right:1px solid var(--line)}
    .metric:nth-child(5){border-right:0}
    .metric .label{color:var(--muted);font-size:12px;margin-bottom:12px}
    .metric .value{color:var(--text);font-family:"Aptos","Segoe UI",sans-serif;font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
    .metric .unit{font-family:"Microsoft YaHei",sans-serif;font-size:11px;font-weight:400;color:var(--muted);margin-left:7px;letter-spacing:0}
    .metric-share{display:flex;align-items:center;gap:12px;margin-top:23px}
    .metric-share-track{height:3px;flex:1;background:#36544a;border-radius:8px;overflow:hidden}
    .metric-share-fill{height:100%;background:var(--amber);border-radius:8px}
    .metric-share>span{min-width:35px;text-align:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
    .metric:last-child{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-start;gap:32px;border-right:0;border-top:1px solid #66725a;background:#344437;padding:18px 24px}
    .metric:last-child .label{margin:0;color:#dce2d5;font-size:13px}
    .metric:last-child .value{display:flex;align-items:center;gap:16px;font-size:40px;color:var(--amber)}
    .metric:last-child .unit{display:block;margin:0;color:var(--muted);line-height:1.4}
    .section{margin:0}
    .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
    .section h2{font-size:18px;font-weight:600;letter-spacing:.02em;margin:0}
    .section-note{color:var(--muted);font-size:12px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
    table{width:100%;min-width:900px;table-layout:fixed;border-collapse:collapse;font-size:13px}
    th{padding:16px 18px;background:var(--panel2);color:#bdcbc1;font-size:11px;font-weight:500;text-align:left;white-space:nowrap}
    td{padding:17px 18px;border-top:1px solid var(--line);vertical-align:middle;text-align:left}
    th:nth-child(n+3):nth-child(-n+7),td.num{text-align:center}
    td.num{font-family:"Aptos","Segoe UI",sans-serif;font-weight:600;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
    .category{font-weight:600;color:var(--text);white-space:nowrap}
    .detail{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
    tbody tr:hover{background:#304139}
    .proof-inline{display:block;margin-top:5px;color:var(--ruby);font-size:11px;font-weight:600;white-space:nowrap;line-height:1.3}
    .links{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;min-width:0}
    .link{display:inline-flex;align-items:center;gap:5px;white-space:normal;overflow-wrap:anywhere;max-width:100%;font-size:12px;text-decoration:none;padding:5px 9px;color:var(--cyan);background:#34473c;border:1px solid transparent;border-radius:6px;line-height:1.4}
    .link:hover{color:var(--text);background:#405548;border-color:#819687}
    .empty{padding:32px;text-align:center;color:var(--muted)}
    .foot{display:flex;justify-content:space-between;gap:24px;margin-top:24px;padding-top:20px;color:var(--muted);font-size:12px;line-height:1.8}
    .foot b{color:#c4d2b9;font-weight:500}
    @media(min-width:1600px){.wrap{padding-top:64px}}
    @media(max-width:1100px){.wrap{width:calc(100% - 48px);padding-top:36px}.top{align-items:flex-start}.title{font-size:32px;gap:8px}.metric{padding:22px 16px}.metric .value{font-size:27px}.source{font-size:12px}.foot{flex-direction:column;gap:6px}}

    @media(prefers-reduced-motion:no-preference){.link,.source-link,.title-month-select{transition:color .15s,background-color .15s,border-color .15s}}

    /* Small screens keep each requirement and its five languages together. */
    .top>div:first-child{min-width:0}
    .foot>span{overflow-wrap:anywhere}
    @media(max-width:1000px){.top{flex-direction:column;gap:18px}.source{text-align:left}.source-tooltip{left:0;right:auto}}
    @media(max-width:760px){
      .title{font-size:clamp(22px,5.7vw,28px);gap:7px}
      .title-month-select{padding:5px 28px 5px 8px;background-position:calc(100% - 15px) 52%,calc(100% - 9px) 52%}
      .metric .value{font-size:clamp(24px,6vw,29px)}
      .metric:last-child .value{font-size:clamp(29px,7vw,34px)}
      .table-wrap{overflow:visible;background:transparent;border:0;border-radius:0}
      table{display:block;min-width:0;font-size:12px}
      colgroup,thead{display:none}
      tbody{display:grid;gap:12px}
      tbody tr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
      td{display:block;min-width:0;padding:14px 5px;border-top:0}
      td.category{grid-column:span 2;padding:16px 14px 12px;font-size:13px;white-space:normal}
      td.detail{grid-column:span 3;min-width:0;padding:16px 14px 12px;text-align:right;overflow-wrap:anywhere}
      td.num{font-size:clamp(12px,3.5vw,15px);padding:12px 2px 16px;background:rgba(0,0,0,.07)}
      td.num::before{content:attr(data-label);display:block;color:var(--muted);font-family:"Microsoft YaHei",sans-serif;font-size:10px;font-weight:400;margin-bottom:8px}
      .proof-inline{font-size:10px}
      td:last-child{grid-column:1/-1;padding:12px 14px;border-top:1px solid var(--line)}
      .links{max-width:none;gap:8px}
      .link{white-space:normal;overflow-wrap:anywhere;min-height:32px;align-items:center}
      .section-note{white-space:nowrap}
    }
  </style>
